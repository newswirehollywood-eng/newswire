name: Wire

# What this does, plain English: once an hour (at 17 minutes past) it runs
# wire.py. wire.py reads the public RSS feeds in data/feeds.json, takes each
# item's headline, link, time and the outlet's own photo, sorts them into our
# sections, and rewrites the homepage, the eight section pages, The Wire and
# feed.xml. Our own stories come from data/originated.json and always sit
# above the wire, so a rebuild can never wipe our journalism off the site.
#
# It also releases embargoed stories: a page waiting in drafts/ moves into
# docs/ on the first run after its embargo time, and not a minute before.
#
# Cost: zero. Standard-library Python, no AI calls, free Actions minutes.
# Trigger: the schedule below, or "Run workflow" on the Actions tab.
# It commits only when a page actually changed.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wire
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the site from the feeds
        run: python3 wire.py

      - name: Rebuild the sitemaps so they match the pages
        run: python3 sitemaps.py

      - name: Commit only if the pages actually changed
        run: |
          git config user.name "world-newswire-bot"
          git config user.email "actions@users.noreply.github.com"
          for p in docs drafts data/wire-items.json runbook/wire-feed-status.md; do
            if [ -e "$p" ]; then git add -A "$p"; fi
          done
          if git diff --cached --quiet -- docs/ drafts/; then
            echo "no page changes this run"
            exit 0
          fi
          git commit -m "Auto: rebuild site from the wire"
          for attempt in 1 2 3 4; do
            if git push; then exit 0; fi
            echo "push failed, refetching and retrying (attempt $attempt)"
            git pull --rebase origin main || true
            sleep $((attempt * 4))
          done
          echo "push failed after retries"
          exit 1
